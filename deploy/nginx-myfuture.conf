# MyFuture API — dedicated port (no domain, IP access)
# Uses direct proxy_pass to avoid duplicate upstream on servers that include sites-enabled twice.

server {
    listen 8088;
    listen [::]:8088;
    server_name _;

    client_max_body_size 12m;

    location / {
        return 200 'MyFuture API gateway. Use /api/health\n';
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:4010/api/;
    }
}
